name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - run: go vet ./...
      - run: go test ./...
      # Guarantees the committed sample report matches the current checks and
      # template. If a check or the template changed without regenerating, this
      # fails: run `make gen` and commit landing/sample-report.html.
      - name: Verify sample report is up to date
        run: |
          go run ./cmd/sample-report
          git diff --exit-code landing/sample-report.html
